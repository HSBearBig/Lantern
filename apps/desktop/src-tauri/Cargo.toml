[workspace]

[package]
name = "lantern-desktop"
version = "0.1.0"
description = "Stage A diagnostic shell for Lantern Host"
edition = "2021"
license = "MIT"

[lib]
name = "lantern_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
arboard = "3"
lantern-host = { path = "../../../crates/host" }
lantern-platform = { path = "../../../crates/platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"
