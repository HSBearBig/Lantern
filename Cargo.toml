[workspace]
members = ["crates/protocol", "crates/platform", "crates/host", "crates/signaling"]
exclude = ["apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lantern-protocol = { path = "crates/protocol" }
lantern-platform = { path = "crates/platform" }
